<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uitsmijters '55</title>
<meta name="description" content="De clubapp van honk- en softbalvereniging Uitsmijters '55 uit Almelo: agenda, wedstrijden, vrijwilligersdiensten en nieuws.">
<meta name="theme-color" content="#12104a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="U55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top wrap">
    <div class="brand">
      <img class="logo" alt="Logo van de club" src="icons/logo.jpg" width="76" height="65">
      <div>
        <h1 style="color:#fff" id="clubnaam"></h1>
        <div class="sub" style="color:#fff" id="clubsub"></div>
      </div>
    </div>
    <div class="kopregel"><nav class="socials" id="socials" aria-label="Volg de club"></nav></div>
  </header>
  <main class="wrap" id="main"><p class="status">Laden...</p></main>
</div>

<nav class="tabs" aria-label="Hoofdmenu">
  <div class="inner">
    <button data-tab="agenda" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
    <button data-tab="wedstrijden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7 5.5c2 2 2 11 0 13M17 5.5c-2 2-2 11 0 13"/></svg>Wedstrijden</button>
    <button data-tab="helpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/></svg>Helpen</button>
    <button data-tab="nieuws"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>Nieuws</button>
    <button data-tab="ac" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM3 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M21 21v-1a6 6 0 0 0-4-5.6"/></svg>Overzicht</button>
    <button data-tab="club"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/><circle cx="12" cy="12" r="2"/></svg>Club</button>
  </div>
</nav>
<noscript><p style="padding:16px">Zet JavaScript aan om de clubapp te gebruiken.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
